<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#243c2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Farm Roll Online v0.8.5</title>
  <link rel="manifest" href="manifest.webmanifest?v=085" />
  <link rel="stylesheet" href="styles.css?v=085" />
</head>
<body>
  <main id="app"></main>

  <!-- Browser build of Supabase JS. No npm/build step required. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Rapid-prototype cache reset: prevent old v0.2/v0.3 service workers from serving stale Farm Roll code.
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if ("caches" in window) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  </script>
  <script src="config.js?v=085"></script>
  <script src="cards.js?v=085"></script>
  <script src="app.js?v=085"></script>
</body>
</html>
